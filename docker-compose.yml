services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl_local_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d retail"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://etl:etl_local_dev_only@postgres:5432/retail
    volumes:
      - ./artifacts:/app/artifacts
    command: ["--data-dir", "data/sample", "--output-dir", "artifacts"]

volumes:
  postgres_data:
